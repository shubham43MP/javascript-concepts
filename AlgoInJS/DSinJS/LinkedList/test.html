<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Crash - Ultimate Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #38bdf8;
            --car-color: #f472b6;
            --road-color: #1e293b;
            --text-color: #f8fafc;
            --speed-color: #22d3ee;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            perspective: 1000px;
        }

        /* The Road */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: repeating-linear-gradient(
                90deg,
                transparent 0%,
                transparent 20%,
                rgba(255,255,255,0.05) 20%,
                rgba(255,255,255,0.05) 22%,
                transparent 22%
            );
            background-size: 100px 100px;
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        /* The Car */
        .car {
            position: absolute;
            bottom: 15%;
            left: 50%;
            width: 100px;
            height: 50px;
            transform: translateX(-50%);
            transition: transform 0.1s linear;
            z-index: 10;
        }

        .car-graphic {
            width: 100%;
            height: 100%;
            background: var(--car-color);
            border-radius: 15px 15px 0 0;
            box-shadow: 0 0 20px var(--car-color);
            position: relative;
            overflow: hidden;
        }

        /* Windshield */
        .car-graphic::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 10%;
            width: 30%;
            height: 40%;
            background: linear-gradient(90deg, rgba(255,255,255,0.4), transparent);
            border-radius: 50%;
        }

        /* The Speedometer */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            color: var(--text-color);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 120px;
        }

        .hud-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .hud-value {
            font-size: 2rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* The Multiplier Display (Center Top) */
        .multiplier-container {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .multiplier-label {
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .multiplier-value {
            font-size: 4rem;
            font-weight: 900;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #fff;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* The Car */
        .car {
            position: absolute;
            bottom: 15%;
            left: 50%;
            width: 100px;
            height: 50px;
            transform: translateX(-50%);
            transition: transform 0.1s linear;
            z-index: 10;
        }

        /* The Speedometer */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            padding: 0 10px; /* Added padding to prevent edge clipping */
        }

        .hud-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            color: var(--text-color);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 120px;
            /* Increased font size slightly for better readability */
            font-size: 1.1rem;
        }

        .hud-label {
            font-size: 0.7rem; /* Slightly smaller label */
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            display: block; /* Ensures label stays on top of value */
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 1.8rem; /* Reduced from 2rem slightly */
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            line-height: 1; /* Prevents line height from pushing text down */
        }

        /* The Multiplier Display (Center Top) */
        .multiplier-container {
            position: absolute;
            top: 10px; /* Moved up from -60px to sit nicely above car */
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5; /* Ensure it sits behind car but in front of road */
        }

        .multiplier-label {
            font-size: 1rem;
            color: #94a3b8;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .multiplier-value {
            font-size: 3.5rem; /* Reduced from 4rem */
            font-weight: 900;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            line-height: 1;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 15; /* Ensure buttons sit above the road */
        }

        /* Status Messages */
        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .status-overlay.show {
            opacity: 1;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Start Screen Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            border-radius: 20px;
        }

        .overlay h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #38bdf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay p {
            color: #cbd5e1;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px var(--accent-color);
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* Speed Lines Effect */
        .speed-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.2) 100%);
        }

        .speed-lines.active {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <!-- Background Elements -->
        <div class="speed-lines" id="speedLines"></div>

        <!-- The Road -->
        <div class="road"></div>

        <!-- The Car -->
        <div class="car" id="car">
            <div class="car-graphic"></div>
        </div>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-panel">
                <div class="hud-label">Speed</div>
                <div class="hud-value" id="speedVal">0<span style="font-size:1rem">MPH</span></div>
            </div>
            <div class="hud-panel">
                <div class="hud-label">Score</div>
                <div class="hud-value" id="scoreVal">0</div>
            </div>
        </div>

        <!-- Center Multiplier -->
        <div class="multiplier-container">
            <div class="multiplier-label">x</div>
            <div class="multiplier-value" id="multiplier">1.00</div>
        </div>

        <!-- Status Messages -->
        <div class="status-overlay" id="statusText">GET READY</div>

        <!-- Start Overlay -->
        <div class="overlay" id="startOverlay">
            <h1>NEON CRASH</h1>
            <p>Press Start to Launch</p>
            <button class="start-btn" id="startBtn">LAUNCH</button>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="actionBtn">GO</button>
        </div>
    </div>

    <script>
        // Game Logic
        const gameContainer = document.getElementById('gameContainer');
        const car = document.getElementById('car');
        const multiplierDisplay = document.getElementById('multiplier');
        const speedDisplay = document.getElementById('speedVal');
        const scoreDisplay = document.getElementById('scoreVal');
        const statusText = document.getElementById('statusText');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const actionBtn = document.getElementById('actionBtn');
        const speedLines = document.getElementById('speedLines');

        let isRunning = false;
        let speed = 0;
        let score = 0;
        let multiplier = 1.00;
        let baseSpeed = 2; // Starting speed multiplier
        let currentSpeed = 2;

        // Configuration
        const MAX_SPEED = 15;
        const START_SPEED = 2;
        const GRAVITY = 0.05; // Tilt effect gravity

        function update() {
            if (!isRunning) return;

            // Increase speed over time
            if (speed < MAX_SPEED) {
                speed += 0.05;
            }

            // Calculate Multiplier (Exponential growth)
            multiplier = 1 + (speed * 0.5);

            // Tilt the car based on speed
            car.style.transform = `translateX(-50%) rotate(${(speed - 2) * 3}deg)`;

            // Update Displays
            multiplierDisplay.innerText = multiplier.toFixed(2);
            speedDisplay.innerText = Math.floor(speed * 10); // Fake MPH

            // Visual Effects
            if (speed > 5) speedLines.classList.add('active');

            requestAnimationFrame(update);
        }

        function startGame() {
            isRunning = true;
            startOverlay.style.display = 'none';
            actionBtn.innerText = "CASH OUT";
            actionBtn.style.background = "linear-gradient(135deg, #f472b6, #db2777)";

            // Initial burst
            currentSpeed = START_SPEED;
            update();
        }

        function cashOut() {
            if (!isRunning) return;

            // Visual feedback
            statusText.innerText = `WON x${multiplier.toFixed(2)}`;
            statusText.classList.add('show');

            // Pulse effect
            statusText.style.transform = 'translate(-50%, -50%) scale(1.2)';
            setTimeout(() => {
                statusText.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);

            // Reset after 1.5 seconds
            setTimeout(() => {
                isRunning = false;
                multiplierDisplay.innerText = "1.00";
                speedDisplay.innerText = "0";
                car.style.transform = `translateX(-50%) rotate(0deg)`;
                actionBtn.innerText = "GO";
                actionBtn.style.background = ""; // Reset to CSS default
            }, 1500);
        }

        function crash() {
            statusText.innerText = "CRASHED!";
            statusText.classList.add('show');
            statusText.style.color = "#f472b6";

            setTimeout(() => {
                isRunning = false;
                multiplierDisplay.innerText = "1.00";
                speedDisplay.innerText = "0";
                car.style.transform = `translateX(-50%) rotate(-10deg)`; // Dramatic fall
                actionBtn.innerText = "RETRY";
            }, 1500);
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);

        actionBtn.addEventListener('click', () => {
            if (isRunning) {
                cashOut();
            } else {
                startGame();
            }
        });

        // Add some random speed lines for background
        function createSpeedLine() {
            const line = document.createElement('div');
            line.style.position = 'absolute';
            line.style.width = '2px';
            line.style.height = '100px';
            line.style.background = 'rgba(255,255,255,0.1)';
            line.style.left = Math.random() * 100 + '%';
            line.style.top = '-100px';
            line.style.borderRadius = '50%';
            line.style.border = '2px solid rgba(255,255,255,0.2)';

            // Animate
            const animate = () => {
                line.style.top = (line.offsetTop + 2) + 'px';
                if(line.offsetTop < 500) requestAnimationFrame(animate);
            };
            requestAnimationFrame(animate);

            document.getElementById('speedLines').appendChild(line);
        }

        // Initialize background
        for(let i=0; i<10; i++) createSpeedLine();

    </script>
</body>
</html>
